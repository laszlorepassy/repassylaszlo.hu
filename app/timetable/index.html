<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <title>Órarend időzítő</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Répássy László - órarend időzítő alkalmazás." />

  <link rel="icon" type="image/png" href="./table-icon-6369326-512.png">
  <link rel="stylesheet" href="style.css?v=e8c82a9">
  <!-- LZ-String a hash-alapú mentéshez (opcionális, de hasznos) -->
  <script src="./lz-string.min.js?v=e8c82a9"></script>
</head>
<body>
  <!-- Felső státusz kijelző (nagy betűvel); role="timer": a képernyőolvasó nem olvassa fel másodpercenként -->
  <div id="statusTop" role="timer">Betöltés...</div>
  <div id="errorMessage" role="alert"></div>

  <header>
    <h1>Órarend időzítő</h1>
    <div class="header-actions">
      <button id="notifyBtn" type="button" hidden>Értesítések bekapcsolása</button>
      <button id="newTabBtn" type="button">Új órarend</button>
    </div>
  </header>

  <!-- Órarend neve -->
  <div class="bar">
    <input type="text" id="timetableName" value="Új órarend" aria-label="Órarend neve" />
  </div>

  <!-- Tanítási napok -->
  <fieldset class="days">
    <legend>Tanítási napok</legend>
    <div id="daysList"></div>
  </fieldset>

  <!-- Órák időpontjai (csak kezdés és befejezés, minden napra közös) -->
  <section class="times" aria-label="Órák időpontjai">
    <div id="timesList"></div>
  </section>

  <script src="script.js?v=e8c82a9"></script>
</body>
</html>
