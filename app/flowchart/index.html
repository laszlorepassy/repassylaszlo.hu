<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowchart</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css?v=88b61b4181">
</head>
<body>
<div id="app">
  <header id="appHeader">
    <nav class="menu">
      <button id="btnNew" class="btn"></button>
      <button id="btnOpen" class="btn"></button>
      <button id="btnSave" class="btn"></button>
      <button id="btnExportImage" class="btn"></button>
      <button id="btnExamples" class="btn"></button>
      <button id="btnFiles" class="btn"></button>
      <input type="text" id="programName" class="program-name-input" value="program">
      <span id="clipboardStatus" class="clipboard-status" hidden title=""></span>
      <span class="spacer"></span>
      <div class="run-controls">
        <button id="btnRun" class="btn btn-run" title="Run">▶</button>
        <button id="btnStep" class="btn" title="Step">⏭</button>
        <button id="btnPause" class="btn" title="Pause">⏸</button>
        <button id="btnReset" class="btn" title="Reset">⟲</button>
        <label class="speed-label"><span id="speedLabel">Speed</span>
          <select id="speedSelect">
            <option id="speedOptSlowest" value="800">Slowest</option>
            <option id="speedOptSlow" value="400">Slow</option>
            <option id="speedOptNormal" value="150" selected>Normal</option>
            <option id="speedOptFast" value="50">Fast</option>
            <option id="speedOptFastest" value="0">Fastest</option>
          </select>
        </label>
      </div>
      <button id="btnHelp" class="btn"></button>
      <select id="langSelect">
        <option value="en">EN</option>
        <option value="hu">HU</option>
      </select>
    </nav>
  </header>

  <div class="routine-tabs" id="routineTabs"></div>

  <main>
    <div class="canvas-outer">
      <div class="canvas-wrap" id="canvasWrap">
        <svg id="flowSvg" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="zoom-controls">
        <button id="btnZoomIn" class="btn btn-small" title="Zoom in">+</button>
        <button id="btnZoomOut" class="btn btn-small" title="Zoom out">−</button>
        <button id="btnZoomFit" class="btn btn-small" title="Fit to view">⛶</button>
      </div>
    </div>
    <aside class="side-panel">
      <div class="side-tabs" id="sideTabs">
        <button class="side-tab active" data-tab="console" id="tabBtnConsole"></button>
        <button class="side-tab" data-tab="vars" id="tabBtnVars"></button>
        <button class="side-tab" data-tab="code" id="tabBtnCode"></button>
      </div>

      <div class="tab-content active" id="tabConsole">
        <div id="consoleOutput" class="console-output"></div>
        <div id="inputRow" class="input-row" hidden>
          <label id="inputLabel" for="inputField"></label>
          <div class="input-row-controls">
            <input type="text" id="inputField">
            <button id="inputSubmit" class="btn btn-primary"></button>
          </div>
        </div>
        <div id="runStatus" class="run-status"></div>
      </div>

      <div class="tab-content" id="tabVars">
        <table class="vars-table">
          <thead><tr><th id="thName"></th><th id="thType"></th><th id="thValue"></th></tr></thead>
          <tbody id="varsBody"></tbody>
        </table>
      </div>

      <div class="tab-content" id="tabCode">
        <div class="code-actions">
          <button id="btnGenerateCode" class="btn btn-primary"></button>
          <select id="codeLangSelect" class="btn btn-small">
            <option value="python">Python</option>
            <option value="cpp">C++</option>
            <option value="csharp">C#</option>
          </select>
          <button id="btnCopyCode" class="btn btn-small"></button>
          <button id="btnDownloadCode" class="btn btn-small"></button>
        </div>
        <pre id="codeOutput" class="code-output"></pre>
      </div>
    </aside>
  </main>

  <div id="modalRoot"></div>
</div>
<script type="module" src="js/app.min.js?v=e015c41a17"></script>
</body>
</html>
