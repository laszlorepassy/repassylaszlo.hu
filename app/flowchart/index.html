<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowchart</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="gateOverlay" class="gate-overlay">
  <form id="gateForm" class="gate-form">
    <div class="gate-title">Flowchart</div>
    <label class="gate-field">
      <span id="gateLabel">Password</span>
      <input type="password" id="gatePassword" autocomplete="current-password">
    </label>
    <button type="submit" class="btn btn-primary" id="gateSubmit">OK</button>
    <div id="gateError" class="gate-error"></div>
  </form>
</div>
<script>
// Temporary client-side gate while this app is being tested — purely a
// casual-visitor deterrent (there is no backend, so this cannot be real
// security; anyone can read the password in this file's source).
(function () {
  var KEY = 'flowchart_gate_ok';
  var PASSWORD = 'flowgorithm';
  var isHu = (navigator.language || '').toLowerCase().indexOf('hu') === 0;
  document.getElementById('gateLabel').textContent = isHu ? 'Jelszó' : 'Password';
  document.getElementById('gateSubmit').textContent = isHu ? 'Belépés' : 'Enter';
  var overlay = document.getElementById('gateOverlay');
  // #app is declared later in the document, so it must be looked up lazily
  // (not at script-parse time, when it wouldn't exist in the DOM yet).
  function unlock() { overlay.style.display = 'none'; document.getElementById('app').style.display = ''; }
  var already = false;
  try { already = sessionStorage.getItem(KEY) === '1'; } catch (e) { /* ignore */ }
  if (already) { unlock(); } else {
    var input = document.getElementById('gatePassword');
    setTimeout(function () { input.focus(); }, 0);
    document.getElementById('gateForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      if (input.value === PASSWORD) {
        try { sessionStorage.setItem(KEY, '1'); } catch (e) { /* ignore */ }
        unlock();
      } else {
        document.getElementById('gateError').textContent = isHu ? 'Hibás jelszó.' : 'Wrong password.';
        input.value = '';
        input.focus();
      }
    });
  }
})();
</script>
<div id="app" style="display:none">
  <header id="appHeader">
    <div class="brand" id="brandTitle">Flowchart</div>
    <nav class="menu">
      <button id="btnNew" class="btn"></button>
      <button id="btnOpen" class="btn"></button>
      <button id="btnSave" class="btn"></button>
      <button id="btnExportCode" class="btn"></button>
      <button id="btnExportImage" class="btn"></button>
      <input type="text" id="programName" class="program-name-input" value="program">
      <span id="clipboardStatus" class="clipboard-status" hidden title=""></span>
      <span class="spacer"></span>
      <div class="run-controls">
        <button id="btnRun" class="btn btn-run" title="Run">▶</button>
        <button id="btnStep" class="btn" title="Step">⏭</button>
        <button id="btnPause" class="btn" title="Pause">⏸</button>
        <button id="btnReset" class="btn" title="Reset">⟲</button>
        <label class="speed-label"><span id="speedLabel">Speed</span>
          <input type="range" id="speedRange" min="0" max="100" value="70">
        </label>
      </div>
      <select id="langSelect">
        <option value="en">EN</option>
        <option value="hu">HU</option>
      </select>
    </nav>
  </header>

  <div class="routine-tabs" id="routineTabs"></div>

  <main>
    <div class="canvas-wrap" id="canvasWrap">
      <svg id="flowSvg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <aside class="side-panel">
      <div class="side-tabs" id="sideTabs">
        <button class="side-tab active" data-tab="vars" id="tabBtnVars"></button>
        <button class="side-tab" data-tab="console" id="tabBtnConsole"></button>
        <button class="side-tab" data-tab="code" id="tabBtnCode"></button>
      </div>

      <div class="tab-content active" id="tabVars">
        <table class="vars-table">
          <thead><tr><th id="thName"></th><th id="thType"></th><th id="thValue"></th></tr></thead>
          <tbody id="varsBody"></tbody>
        </table>
      </div>

      <div class="tab-content" id="tabConsole">
        <div id="consoleOutput" class="console-output"></div>
        <div id="inputRow" class="input-row" hidden>
          <label id="inputLabel" for="inputField"></label>
          <div class="input-row-controls">
            <input type="text" id="inputField">
            <button id="inputSubmit" class="btn btn-primary"></button>
          </div>
        </div>
        <div id="runStatus" class="run-status"></div>
      </div>

      <div class="tab-content" id="tabCode">
        <div class="code-actions">
          <button id="btnCopyCode" class="btn btn-small"></button>
          <button id="btnDownloadCode" class="btn btn-small"></button>
        </div>
        <pre id="codeOutput" class="code-output"></pre>
      </div>
    </aside>
  </main>

  <div id="modalRoot"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
