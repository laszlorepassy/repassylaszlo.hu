<script>
(function () {
  var gate = document.getElementById('secret-gate');
  var content = document.getElementById('secret-content');
  var input = document.getElementById('secret-password');
  var button = document.getElementById('secret-submit');
  var message = document.getElementById('secret-message');
  var payload = JSON.parse(document.getElementById('secret-payload').textContent);
  var storageKey = 'secret-page:' + location.pathname;

  function bytes(base64) {
    return Uint8Array.from(atob(base64), function (c) { return c.charCodeAt(0); });
  }

  // Ugyanaz a "megbocsátó" alak, mint titkosításkor: ékezet, kis/nagybetű,
  // szóköz és írásjel nem számít.
  function canonicalize(password) {
    return password.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  function decrypt(password) {
    var subtle = window.crypto && window.crypto.subtle;
    if (!subtle) {
      return Promise.reject(new Error('nincs-webcrypto'));
    }
    return subtle.importKey('raw', new TextEncoder().encode(canonicalize(password)), 'PBKDF2', false, ['deriveKey'])
      .then(function (baseKey) {
        return subtle.deriveKey(
          { name: 'PBKDF2', salt: bytes(payload.salt), iterations: payload.iterations, hash: 'SHA-256' },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      })
      .then(function (key) {
        return subtle.decrypt({ name: 'AES-GCM', iv: bytes(payload.iv) }, key, bytes(payload.ciphertext));
      })
      .then(function (plain) {
        return new TextDecoder().decode(plain);
      });
  }

  function reveal(html) {
    content.innerHTML = html;
    content.hidden = false;
    gate.remove();
    // A képletek a betöltés után érkeztek, ezért újra kell szedetni őket.
    if (window.MathJax && window.MathJax.typesetPromise) {
      window.MathJax.typesetPromise([content]);
    }
  }

  function attempt(password, fromStorage) {
    button.disabled = true;
    message.style.color = '#4b5563';
    message.textContent = fromStorage ? '' : 'Egy pillanat…';
    return decrypt(password).then(function (html) {
      try { localStorage.setItem(storageKey, password); } catch (e) { /* privát böngészés */ }
      reveal(html);
    }).catch(function (error) {
      button.disabled = false;
      message.style.color = '#b91c1c';
      if (error && error.message === 'nincs-webcrypto') {
        message.textContent = 'A böngésző nem engedi a visszafejtést. Nyisd meg az oldalt https címen.';
      } else if (fromStorage) {
        message.textContent = '';
      } else {
        message.textContent = 'Hibás jelszó.';
      }
      try { localStorage.removeItem(storageKey); } catch (e) { /* nem baj */ }
    });
  }

  button.addEventListener('click', function () {
    if (input.value) { attempt(input.value, false); }
  });
  input.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' && input.value) { attempt(input.value, false); }
  });
