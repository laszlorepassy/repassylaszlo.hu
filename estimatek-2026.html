  // szóköz és írásjel nem számít.
  function canonicalize(password) {
    return password.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  // korábban elmentett másolat. A jelszó megjegyzése (localStorage) ettől
  // független, azt nem érinti.

    .then(function (res) { return res.text(); })
    .then(function (html) {
